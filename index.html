<html lang="en">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #090a0f;
            color: #e2e8f0;
        }
        .glass {
            background: rgba(18, 20, 29, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card {
            background: rgba(26, 29, 45, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .chat-container::-webkit-scrollbar {
            width: 5px;
        }
        .chat-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        
        /* FIX SIDEBAR OVERLAY & Z-INDEX */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            z-index: 9999; /* Memastikan sidebar melayang paling atas */
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateX(-100%);
            background-color: #0f111a; /* Latar belakang padat agar tidak menimpa transparan */
        }
        .sidebar.active {
            transform: translateX(0);
        }
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 9998; /* Berada tepat di bawah sidebar */
            display: none;
        }
        .sidebar-overlay.active {
            display: block;
        }
    </style>
</head>
<body class="h-screen flex flex-col justify-between overflow-hidden bg-[#090a0f]">

    <!-- OVERLAY SIDEBAR (FIX) -->
    <div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

            <!-- MENU ITEM -->
            <div class="space-y-1">
                <button onclick="newChat()" class="w-full text-left px-3 py-2.5 rounded-xl hover:bg-white/5 transition flex items-center gap-3 text-sm font-medium">
                    <i class="fa-solid fa-plus text-purple-400"></i> Percakapan Baru
                </button>
                <button onclick="showHistory()" class="w-full text-left px-3 py-2.5 rounded-xl hover:bg-white/5 transition flex items-center gap-3 text-sm font-medium">
                    <i class="fa-solid fa-clock-rotate-left text-blue-400"></i> Lihat Riwayat
                </button>
                <button onclick="searchHistory()" class="w-full text-left px-3 py-2.5 rounded-xl hover:bg-white/5 transition flex items-center gap-3 text-sm font-medium">
                    <i class="fa-solid fa-magnifying-glass text-emerald-400"></i> Cari Riwayat
                </button>
                <button onclick="clearHistory()" class="w-full text-left px-3 py-2.5 rounded-xl hover:bg-white/5 transition flex items-center gap-3 text-sm font-medium text-red-400">
                    <i class="fa-solid fa-trash"></i> Hapus Semua Riwayat
                </button>
                
                <hr class="border-white/10 my-2">

                <button onclick="generateImage()" class="w-full text-left px-3 py-2.5 rounded-xl hover:bg-white/5 transition flex items-center gap-3 text-sm font-medium">
                    <i class="fa-solid fa-image text-pink-400"></i> Generate Gambar
                </button>
                <button onclick="exportChat()" class="w-full text-left px-3 py-2.5 rounded-xl hover:bg-white/5 transition flex items-center gap-3 text-sm font-medium">
                    <i class="fa-solid fa-file-export text-amber-400"></i> Export Chat
                </button>
                <button onclick="openSystemPrompt()" class="w-full text-left px-3 py-2.5 rounded-xl hover:bg-white/5 transition flex items-center gap-3 text-sm font-medium">
                    <i class="fa-solid fa-sliders text-cyan-400"></i> System Prompt
                </button>
                <button onclick="changeTheme()" class="w-full text-left px-3 py-2.5 rounded-xl hover:bg-white/5 transition flex items-center gap-3 text-sm font-medium">
                    <i class="fa-solid fa-palette text-violet-400"></i> Ganti Tema
                </button>
                <button onclick="location.reload()" class="w-full text-left px-3 py-2.5 rounded-xl hover:bg-white/5 transition flex items-center gap-3 text-sm font-medium">
                    <i class="fa-solid fa-arrows-rotate text-gray-400"></i> Refresh Web
                </button>
            </div>
        </div>

        <div class="text-xs text-gray-500 text-center border-t border-white/10 pt-3">
            v2.5 • Developed by GIL_XZ

    <!-- TOP NAVBAR -->
    <header class="glass sticky top-0 z-10 px-4 py-3 flex items-center justify-between border-b border-white/10">
        <div class="flex items-center gap-3">
            <button onclick="toggleSidebar()" class="p-2 rounded-xl bg-white/5 hover:bg-white/10 transition text-gray-200">
                <i class="fa-solid fa-bars text-lg"></i>
            </button>
            <div class="flex items-center gap-2">

                    ∞
                </div>
                <div>
                    <h1 class="font-bold text-sm leading-tight text-white">GIL_XZ AI</h1>
                    <div class="flex items-center gap-2 text-[10px] text-gray-400">

            </div>
        </div>

        <div class="flex items-center gap-2">
            <select id="modelSelect" class="bg-white/5 border border-white/10 rounded-xl px-3 py-1.5 text-xs text-gray-200 focus:outline-none focus:border-purple-500">
                <option value="gpt-5.4-nano" class="bg-gray-900">GPT-5.4 Nano</option>
                <option value="gpt-4o" class="bg-gray-900">GPT-4o Mini</option>
                <option value="claude-3-haiku" class="bg-gray-900">Claude 3 Haiku</option>
            </select>
            <button onclick="location.reload()" class="p-2 rounded-xl bg-white/5 hover:bg-white/10 transition text-gray-400 hover:text-white">
                <i class="fa-solid fa-arrows-rotate text-sm"></i>
            </button>
        </div>
    </header>

    <!-- MAIN CHAT AREA -->
    <main id="chatBox" class="chat-container flex-1 overflow-y-auto p-4 max-w-2xl mx-auto w-full space-y-4">
        
        <!-- USER MESSAGE -->
        <div class="flex justify-end">
            <div class="bg-purple-600/90 text-white p-3.5 rounded-2xl rounded-tr-none text-sm max-w-[85%] shadow-lg space-y-2">
                <p>haiiii</p>
                <div class="flex gap-2 justify-end text-[10px] opacity-70 border-t border-white/20 pt-1">
                    <button class="hover:underline">Edit</button>
                    <button class="hover:underline">Hapus</button>
                </div>
            </div>
            <div class="text-[10px] text-gray-400 ml-2 self-start mt-1">Kamu</div>
        </div>

        <!-- AI MESSAGE -->
        <div class="flex gap-3 items-start">
            <div class="w-8 h-8 rounded-xl bg-purple-600 flex items-center justify-center font-bold text-xs shrink-0 text-white shadow-lg">
                ∞
            </div>
            <div class="glass-card p-4 rounded-2xl rounded-tl-none text-sm max-w-[85%] space-y-3">
                <p class="font-medium text-white">Haiiii! 👋 😊 Senang ketemu kamu.</p>
                <p class="text-gray-300 leading-relaxed">
                    Kamu lagi pengin ngobrolin apa nih—mau dibantu ngerjain sesuatu, cari ide, atau sekadar curhat?
                </p>
                <div class="flex gap-3 text-xs text-gray-400 pt-2 border-t border-white/5">
                    <button class="hover:text-white flex items-center gap-1"><i class="fa-solid fa-volume-high text-[10px]"></i> Baca</button>
                    <button class="hover:text-white flex items-center gap-1"><i class="fa-solid fa-rotate-right text-[10px]"></i> Ulangi</button>
                    <button class="hover:text-red-400 flex items-center gap-1"><i class="fa-solid fa-trash text-[10px]"></i> Hapus</button>
                </div>
            </div>
        </div>

    </main>

    <!-- FOOTER INPUT AREA -->
    <footer class="p-3 glass border-t border-white/10">
        <div class="max-w-2xl mx-auto space-y-2">
            <div class="flex items-center gap-2 bg-white/5 border border-white/10 rounded-2xl p-1.5 focus-within:border-purple-500/50 transition">
                <button class="p-2 text-gray-400 hover:text-white rounded-xl hover:bg-white/5 transition">
                    <i class="fa-solid fa-paperclip"></i>
                </button>
                <button class="p-2 text-gray-400 hover:text-white rounded-xl hover:bg-white/5 transition">

                <input type="text" id="userInput" placeholder="Ketik pesanmu..." class="bg-transparent flex-1 text-sm text-white focus:outline-none px-2 placeholder:text-gray-500">

                    <i class="fa-solid fa-paper-plane text-xs"></i>

            </div>

            <div class="flex justify-between items-center text-[10px] text-gray-500 px-2">
                <span>Total pengunjung: <strong>177</strong></span>
                <a href="https://t.me/GIL_XZ" target="_blank" class="hover:text-purple-400 transition">GIL_XZ.t.me</a>
            </div>
        </div>
    </footer>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            if (!input.value.trim()) return;
            
            // Tambahkan aksi pengiriman pesan di sini
            input.value = '';
        }

        function newChat() {
            toggleSidebar();
            // Logika percakapan baru
        }

        function showHistory() {
            toggleSidebar();
            // Logika riwayat
        }

        function searchHistory() {
            toggleSidebar();
            // Logika pencarian
        }

        function clearHistory() {
            toggleSidebar();
            // Logika hapus riwayat
        }

        function generateImage() {
            toggleSidebar();
            // Logika generator gambar
        }

        function exportChat() {
            toggleSidebar();
            // Logika ekspor chat
        }

        function openSystemPrompt() {
            toggleSidebar();
            // Logika prompt sistem
        }

        function changeTheme() {
            toggleSidebar();
            // Logika ganti tema
        }
    </script>
